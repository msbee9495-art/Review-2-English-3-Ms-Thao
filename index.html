function save(){try{localStorage.setItem('msThaoEnglish3',JSON.stringify(store))}catch(e){}}function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}function el(){return document.getElementById('app')}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function refresh(){document.getElementById('who').textContent='👧 '+(store.name||'Student');let total=Object.values(store.results).reduce((a,v)=>a+Number(v.score||0),0);document.getElementById('score').textContent='⭐ '+total+' best points'}function tone(ok){if(!soundOn)return;try{let C=window.AudioContext||window.webkitAudioContext;if(!C)return;let c=new C(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.setValueAtTime(ok?600:220,c.currentTime);if(ok)o.frequency.exponentialRampToValueAtTime(880,c.currentTime+.14);g.gain.setValueAtTime(.075,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.24);o.start();o.stop(c.currentTime+.25);o.onended=()=>c.close()}catch(e){}}function toggleSound(){soundOn=!soundOn;document.getElementById('sound').textContent=soundOn?'🔊 Sound ON':'🔇 Sound OFF'}function resultKey(u,g){return u+'-'+g}function home(){screen='home';refresh();let cards=DATA.map((u,i)=>{let rs=Array.from({length:5},(_,g)=>store.results[resultKey(i,g)]).filter(Boolean);let stars=rs.reduce((a,r)=>a+Math.round(r.score/10),0);return `<div class="tile"><div class="emoji">${u.emoji}</div><h3>Unit ${i+1}: ${esc(u.title)}</h3><p class="muted">⭐ ${stars} stars · ${rs.length}/5 games</p><button class="btn" onclick="openUnit(${i})">▶ PLAY NOW</button></div>`}).join('');el().innerHTML=`<div class="panel center"><h2>👋 WELCOME TO ENGLISH 3!</h2><label for="student">Your name / Tên học sinh</label><p><input class="student" id="student" maxlength="35" placeholder="Enter your name" value="${esc(store.name)}" oninput="setName(this.value)"></p><p class="muted">Choose any Unit to play. Your best results are saved on this device.</p><div class="progress"><div style="width:${Object.keys(store.results).length/50*100}%"></div></div><p>${Object.keys(store.results).length}/50 games completed</p></div><div class="grid">${cards}</div><div class="actions"><button class="btn danger" onclick="resetProgress()">🗑 RESET PROGRESS</button></div>`}function setName(v){store.name=v;save();refresh()}function resetProgress(){if(confirm('Delete all saved results and student name on this device?')){store={name:'',results:{}};save();home()}}function openUnit(i){unit=i;screen='unit';let u=DATA[i];el().innerHTML=`<div class="panel center"><div style="font-size:62px">${u.emoji}</div><h2>Unit ${i+1}: ${esc(u.title)}</h2><p>Choose a game to start!</p><div class="grid">${GAMES.map((n,g)=>{let r=store.results[resultKey(i,g)];return `<div class="tile"><h3>${n}</h3><p class="muted">${[10,10,5,5,10][g]} ${g===2?'pairs':g===3?'sentences':'questions'}</p><p>${r?'🏅 Best: '+r.score+' points':'✨ Not played yet'}</p><button class="btn" onclick="startGame(${g})">${r?'PLAY AGAIN':'PLAY NOW'}</button></div>`}).join('')}</div><div class="actions"><button class="btn ghost" onclick="home()">🏠 HOME</button></div></div>`}function startGame(g){game=g;idx=0;points=0;first=0;mistake=false;locked=false;matched=0;selection=[];picked=[];completed=false;let u=DATA[unit];questions=g===0?shuffle(u.vqs):g===1?shuffle(u.sqs):g===2?shuffle(u.match):g===3?shuffle(u.orders):shuffle(u.final);screen='play';renderQuestion()}
function heading(){let total=questions.length;return `<div class="bar"><span class="pill">Unit ${unit+1} · Game ${game+1}</span><span class="pill">⭐ ${points} pts</span></div><div class="progress"><div style="width:${(game===2?matched:idx)/total*100}%"></div></div><p class="muted center">${game===2?'Matched '+matched+' / '+total:'Question '+(idx+1)+' / '+total}</p>`}function renderQuestion(){locked=false;mistake=false;selection=[];picked=[];if(game===2){renderMatch();return}let q=questions[idx];if(game===3){let words=shuffle(q.split(' ').map((w,i)=>({id:i,word:w})));window.currentWords=words;el().innerHTML=`<div class="panel">${heading()}<h2 class="center">🔠 Put the words in the correct order</h2><p class="center muted">Tap the words to make a sentence.</p><div class="answerbank" id="answerbank"></div><div class="wordbank" id="wordbank"></div><div id="feedback" class="feedback"></div><div class="actions"><button class="btn" id="check" onclick="checkOrder()">✔ CHECK</button><button class="btn secondary" onclick="resetOrder()">↺ RESET</button><button class="btn ghost hide" id="next" onclick="advance()">NEXT ➜</button></div><div class="actions"><button class="btn ghost" onclick="openUnit(unit)">← BACK TO UNIT</button></div></div>`;drawWords();return}let options=shuffle(q.opts);el().innerHTML=`<div class="panel">${heading()}<h2 class="center">${GAMES[game]}</h2><div class="question center">${esc(q.q)}</div><div class="options">${options.map((o,i)=>`<button class="option" id="opt${i}" onclick="choose(${i})">${'ABCD'[i]}. ${esc(o)}</button>`).join('')}</div><div id="feedback" class="feedback"></div><div class="actions"><button class="btn secondary hide" id="retry" onclick="retry()">↺ TRY AGAIN</button><button class="btn ghost hide" id="next" onclick="advance()">NEXT ➜</button></div><div class="actions"><button class="btn ghost" onclick="openUnit(unit)">← BACK TO UNIT</button></div></div>`;window.optionValues=options}
function praise(){return PRAISE[Math.floor(Math.random()*PRAISE.length)]}function choose(i){if(locked)return;let correct=window.optionValues[i]===questions[idx].a;let b=document.getElementById('opt'+i);if(correct){locked=true;b.classList.add('good');if(!mistake){points+=10;first++}document.getElementById('feedback').innerHTML=`<span class="success">${praise()} ${!mistake?'+10 ⭐':''}</span>`;tone(true);document.getElementById('next').classList.remove('hide');document.querySelectorAll('.option').forEach(x=>x.disabled=true)}else{mistake=true;locked=true;b.classList.add('bad');document.getElementById('feedback').innerHTML='<span class="error">Oops! Try again! 💚</span>';tone(false);document.getElementById('retry').classList.remove('hide')}}function retry(){locked=false;document.querySelectorAll('.option').forEach(x=>{x.classList.remove('bad');x.disabled=false});document.getElementById('feedback').textContent='';document.getElementById('retry').classList.add('hide')}
function drawWords(){let bank=document.getElementById('wordbank'),ans=document.getElementById('answerbank');bank.innerHTML=window.currentWords.filter(w=>!picked.includes(w.id)).map(w=>`<button class="word" onclick="addWord(${w.id})">${esc(w.word)}</button>`).join('');ans.innerHTML=picked.map((id,j)=>`<button class="word" onclick="removeWord(${j})">${esc(window.currentWords.find(w=>w.id===id).word)}</button>`).join('')}function addWord(id){if(locked)return;picked.push(id);drawWords()}function removeWord(j){if(locked)return;picked.splice(j,1);drawWords()}function resetOrder(){if(locked)return;picked=[];drawWords();document.getElementById('feedback').textContent=''}function checkOrder(){if(locked)return;let answer=picked.map(id=>window.currentWords.find(w=>w.id===id).word).join(' ').toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();let target=questions[idx].toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();if(answer===target){locked=true;if(!mistake){points+=10;first++}document.getElementById('feedback').innerHTML=`<span class="success">${praise()} ${!mistake?'+10 ⭐':''}</span><p class="muted">${esc(questions[idx])}</p>`;document.getElementById('next').classList.remove('hide');document.getElementById('check').disabled=true;tone(true)}else{mistake=true;document.getElementById('feedback').innerHTML='<span class="error">Oops! Try again! 💚</span>';tone(false)}}function advance(){idx++;if(idx>=questions.length){finish()}else{renderQuestion()}}
function renderMatch(){let cards=[];questions.forEach((v,i)=>{cards.push({id:i,side:'word',label:v[0]});cards.push({id:i,side:'meaning',label:v[1]+' '+v[2]})});cards=shuffle(cards);window.matchCards=cards;window.matchGone=new Set();selection=[];el().innerHTML=`<div class="panel">${heading()}<h2 class="center">🧩 Matching Game</h2><p class="center muted">Match English words with Vietnamese meanings.</p><div class="matchgrid">${cards.map((c,i)=>`<button class="match" id="card${i}" onclick="pickMatch(${i})">${esc(c.label)}</button>`).join('')}</div><div id="feedback" class="feedback"></div><div class="actions"><button class="btn ghost" onclick="openUnit(unit)">← BACK TO UNIT</button></div></div>`}function pickMatch(i){if(locked||window.matchGone.has(i)||selection.includes(i))return;selection.push(i);document.getElementById('card'+i).classList.add('selected');if(selection.length===2){let [a,b]=selection,ca=window.matchCards[a],cb=window.matchCards[b];locked=true;if(ca.id===cb.id&&ca.side!==cb.side){matched++;points+=10;first++;tone(true);document.getElementById('feedback').innerHTML=`<span class="success">${praise()} +10 ⭐</span>`;window.matchGone.add(a);window.matchGone.add(b);setTimeout(()=>{document.getElementById('card'+a)?.classList.add('gone');document.getElementById('card'+b)?.classList.add('gone');selection=[];locked=false;if(matched===questions.length)finish()},450)}else{tone(false);document.getElementById('feedback').innerHTML='<span class="error">Oops! Try again! 💚</span>';document.getElementById('card'+a).classList.add('shake');document.getElementById('card'+b).classList.add('shake');setTimeout(()=>{[a,b].forEach(n=>document.getElementById('card'+n)?.classList.remove('selected','shake'));selection=[];locked=false},650)}}}
function finish(){if(completed)return;completed=true;let max=questions.length*10,pct=points/max*100,medal=pct>=90?'🥇 Gold Medal':pct>=70?'🥈 Silver Medal':pct>=50?'🥉 Bronze Medal':'💪 Keep Practising!';let k=resultKey(unit,game),old=store.results[k];if(!old||points>old.score)store.results[k]={score:points,first,max};save();refresh();el().innerHTML=`<div class="panel center"><div style="font-size:75px">🎉💎🏆</div><h1>CONGRATULATIONS!</h1><h2>${esc(store.name||'Super Star')}!</h2><h2>⭐ ${points} / ${max} points</h2><p>Correct on first try: <strong>${first} / ${questions.length}</strong></p><h2>${medal}</h2><p>Great effort! Keep learning English!</p><div class="actions"><button class="btn" onclick="startGame(game)">↺ PLAY AGAIN</button><button class="btn secondary" onclick="${game<4?'startGame(game+1)':'openUnit(unit)'}">${game<4?'NEXT GAME ➜':'UNIT COMPLETE ✔'}</button><button class="btn ghost" onclick="openUnit(unit)">BACK TO UNIT</button><button class="btn ghost" onclick="home()">🏠 HOME</button></div></div>`;tone(true)}home();
</script></body></html>
